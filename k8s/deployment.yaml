apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature
  template:
    metadata:
      labels:
        app: temperature
    spec:
      containers:
        - name: temperature
          image: temperature:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
